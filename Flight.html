<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FlightLog</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06090f;color:#dce4f0;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
#hdr{padding:50px 16px 14px;background:#06090f;border-bottom:1px solid rgba(255,255,255,0.1)}
.brand{font-size:18px;font-weight:700;color:#f97316;letter-spacing:3px}
#content{flex:1;overflow-y:auto;padding:16px}
#nav{display:flex;border-top:1px solid rgba(255,255,255,0.1);background:#06090f}
.ntab{flex:1;padding:12px 4px;border:none;background:none;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.ntab.active{color:#f97316}
.ni{font-size:22px}
.page{display:none}
.page.active{display:block}
.card{background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.1)}
.btn{background:#f97316;color:white;border:none;border-radius:8px;padding:14px;font-size:14px;width:100%;margin-top:10px;cursor:pointer}
input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#dce4f0;padding:12px;font-size:14px;width:100%;margin-top:6px}
label{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div id="hdr">
  <div class="brand">✈ FLIGHT LOG</div>
  <div id="stats" style="display:flex;gap:16px;margin-top:10px;font-size:12px;color:rgba(255,255,255,0.5)"></div>
</div>
<div id="content">
  <div class="page active" id="pg-map">
    <div id="trips-map"></div>
  </div>
  <div class="page" id="pg-trips">
    <div id="trips-list"></div>
  </div>
  <div class="page" id="pg-add">
    <div class="card">
      <label>行程名稱</label>
      <input type="text" id="inp-name" placeholder="例：東京之旅">
      <label style="margin-top:12px;display:block">出發地</label>
      <input type="text" id="inp-from" placeholder="例：TPE 台北">
      <label style="margin-top:12px;display:block">目的地</label>
      <input type="text" id="inp-to" placeholder="例：NRT 東京">
      <label style="margin-top:12px;display:block">日期</label>
      <input type="date" id="inp-date">
      <label style="margin-top:12px;display:block">班機號碼</label>
      <input type="text" id="inp-fn" placeholder="例：BR255">
      <button class="btn" id="btn-save">儲存行程 ✈</button>
    </div>
  </div>
</div>
<div id="nav">
  <button class="ntab active" id="nav-map"><span class="ni">🗺</span><span>地圖</span></button>
  <button class="ntab" id="nav-trips"><span class="ni">📋</span><span>行程</span></button>
  <button class="ntab" id="nav-add"><span class="ni">＋</span><span>新增</span></button>
</div>

<script>
var trips = [];

function save(){try{localStorage.setItem('fl',JSON.stringify(trips));}catch(e){}}
function load(){try{var r=localStorage.getItem('fl');if(r)trips=JSON.parse(r);}catch(e){}}

function switchTab(t){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.ntab').forEach(function(b){b.classList.remove('active');});
  document.getElementById('pg-'+t).classList.add('active');
  document.getElementById('nav-'+t).classList.add('active');
  if(t==='map') renderMap();
  if(t==='trips') renderTrips();
}

function renderStats(){
  document.getElementById('stats').innerHTML =
    '<span>'+trips.length+' 行程</span>' +
    '<span>'+trips.reduce(function(s,t){return s+(t.legs||[]).length;},0)+' 航班</span>';
}

function renderMap(){
  var el = document.getElementById('trips-map');
  if(!trips.length){
    el.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">尚無行程<br>點 ＋ 新增第一趟旅程</div>';
    return;
  }
  el.innerHTML = trips.map(function(t,i){
    var cols = ["#f97316","#3b82f6","#a855f7","#10b981","#f59e0b"];
    var col = cols[i%cols.length];
    return '<div class="card" style="border-left:4px solid '+col+'">'+
      '<div style="font-weight:700;font-size:15px">'+esc(t.name)+'</div>'+
      (t.legs||[]).map(function(l){
        return '<div style="margin-top:8px;font-size:13px;color:rgba(255,255,255,0.6)">'+
          esc(l.from)+' → '+esc(l.to)+
          (l.fn?' <span style="color:'+col+';font-family:monospace">'+esc(l.fn)+'</span>':'')+
          (l.date?' <span style="color:rgba(255,255,255,0.35);font-size:11px">'+esc(l.date)+'</span>':'')+
        '</div>';
      }).join('')+
    '</div>';
  }).join('');
}

function renderTrips(){
  var el = document.getElementById('trips-list');
  if(!trips.length){
    el.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">尚無行程</div>';
    return;
  }
  el.innerHTML = trips.map(function(t,i){
    var cols = ["#f97316","#3b82f6","#a855f7","#10b981","#f59e0b"];
    var col = cols[i%cols.length];
    return '<div class="card" style="border-left:4px solid '+col+'">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div style="font-weight:700;font-size:15px">'+esc(t.name)+'</div>'+
      '<button data-id="'+i+'" style="background:none;border:1px solid rgba(239,68,68,0.4);color:rgba(239,68,68,0.6);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer" class="del-btn">刪除</button>'+
      '</div>'+
      (t.legs||[]).map(function(l){
        return '<div style="margin-top:8px;font-size:13px;color:rgba(255,255,255,0.6)">'+esc(l.from)+' → '+esc(l.to)+(l.fn?' · '+esc(l.fn):'')+(l.date?' · '+esc(l.date):'')+'</div>';
      }).join('')+
    '</div>';
  }).join('');

  document.querySelectorAll('.del-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-id'));
      trips.splice(idx, 1);
      save(); renderTrips(); renderStats(); renderMap();
    });
  });
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('nav-map').addEventListener('click', function(){switchTab('map');});
document.getElementById('nav-trips').addEventListener('click', function(){switchTab('trips');});
document.getElementById('nav-add').addEventListener('click', function(){switchTab('add');});

document.getElementById('btn-save').addEventListener('click', function(){
  var name = document.getElementById('inp-name').value.trim();
  var from = document.getElementById('inp-from').value.trim();
  var to = document.getElementById('inp-to').value.trim();
  var date = document.getElementById('inp-date').value;
  var fn = document.getElementById('inp-fn').value.trim();
  if(!name){alert('請輸入行程名稱');return;}
  if(!from||!to){alert('請輸入出發地和目的地');return;}
  trips.push({name:name, legs:[{from:from,to:to,date:date,fn:fn}]});
  save(); renderStats(); renderMap();
  document.getElementById('inp-name').value='';
  document.getElementById('inp-from').value='';
  document.getElementById('inp-to').value='';
  document.getElementById('inp-date').value='';
  document.getElementById('inp-fn').value='';
  switchTab('map');
});

load();
renderStats();
renderMap();
</script>

</body>
</html>
