<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FlightLog Pro v9.9 - Luxury Restore</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090e;--surface:#161b22;--border:rgba(255,255,255,0.1);--text:#dce4f0;--muted:#8b949e;--accent:#f97316;--accent2:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#hdr{padding:calc(44px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#content{flex:1;overflow-y:auto;padding-bottom:100px}
#map-wrap{position:relative;margin:16px;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:#0d1117;height:180px}
#map-canvas{width:100%;height:100%}
.card{background:var(--surface);border-radius:18px;padding:16px;margin:12px;border:1px solid var(--border);position:relative}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent);color:white;font-weight:700}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;padding:calc(40px + env(safe-area-inset-top)) 20px}
.modal-content{flex:1;overflow-y:auto}
input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:white;padding:14px;width:100%;margin-bottom:10px;outline:none}
.btn-orange{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;width:100%;font-weight:700;margin-top:10px}
.flight-item{background:rgba(255,255,255,0.05);padding:12px;border-radius:12px;margin-bottom:10px;border-left:4px solid var(--accent2)}
.exp-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:16px 0;background:none;border:none;color:var(--muted);text-align:center;font-size:11px}
.ntab.active{color:var(--accent)}
</style>
</head>
<body>

<div id="hdr">
    <div style="color:var(--accent);font-weight:700;letter-spacing:2px">● FLIGHT LOG PRO</div>
    <div style="font-size:10px;color:var(--muted);border:1px solid var(--border);padding:4px 8px;border-radius:20px" onclick="backupData()">備份數據</div>
</div>

<div id="content">
  <div id="pg-map" class="page">
    <div id="map-wrap"><canvas id="map-canvas"></canvas></div>
    <div id="trips-list"></div>
  </div>
  <div id="pg-add" class="page" style="display:none;padding:20px">
    <input type="text" id="i-name" placeholder="行程名稱">
    <div id="leg-container"></div>
    <button onclick="addLeg()" style="width:100%;padding:12px;margin:10px 0;background:none;border:1px dashed var(--muted);color:var(--muted);border-radius:12px">＋ 新增航段</button>
    <button class="btn-orange" onclick="saveTrip()">儲存行程 ✈</button>
  </div>
</div>

<div id="modal" class="modal">
  <span style="align-self:flex-end;font-size:28px;padding:10px;color:var(--muted)" onclick="closeModal()">✕</span>
  <div class="modal-content" id="modal-content"></div>
</div>

<div id="nav">
  <button class="ntab active" id="btn-map" onclick="showPg('map')">🗺️ 地圖</button>
  <button class="ntab" id="btn-add" onclick="showPg('add')">＋ 新增</button>
</div>

<script>
const AIRPORTS = {"KHH":{lat:22.57,lng:120.34},"TPE":{lat:25.07,lng:121.23},"ICN":{lat:37.46,lng:126.45},"KIX":{lat:34.43,lng:135.24},"DPS":{lat:-8.74,lng:115.16},"MFM":{lat:22.15,lng:113.59},"DAD":{lat:16.05,lng:108.20},"BKK":{lat:13.69,lng:100.75}};

// 根據您的截圖完美復原的資料庫
const recoveredData = [
    {
        name:"2025 澳門", 
        legs:[
            {f:"KHH",t:"MFM",d:"2025-10-25",n:"BR2913",info:"長榮航空 (KHH-MFM)"},
            {f:"MFM",t:"KHH",d:"2025-10-27",n:"BR830",info:"長榮航空 (MFM-KHH)"}
        ], 
        exps:[
            {d:"機票+飯店 (澳門藝舍)",a:21814},{d:"eSIM",a:454},{d:"澳門通",a:1284},{d:"水舞間",a:6776},{d:"上葡京自助山buffet",a:6794},{d:"寵物零食",a:370},{d:"張權中藥油",a:456},{d:"公費",a:6176},{d:"Bamu伴手禮",a:5297}
        ]
    },
    {
        name:"2025 曼谷跨年", 
        legs:[
            {f:"KHH",t:"BKK",d:"2025-12-29",n:"TG631",info:"泰國航空 (TPE-BKK)"},
            {f:"BKK",t:"KHH",d:"2026-01-02",n:"TG630",info:"泰國航空 (BKK-TPE)"}
        ], 
        exps:[
            {d:"機票+飯店 (曼谷邱素逸坤飯店)",a:30464},{d:"eSIM",a:442},{d:"保險",a:2332},{d:"刷卡",a:11407},{d:"換泰銖",a:20000}
        ]
    },
    {
        name:"2023 釜山", 
        legs:[
            {f:"KHH",t:"ICN",d:"2023-04-11",n:"BR146",info:"07:15 起飛"},
            {f:"ICN",t:"TPE",d:"2023-04-16",n:"CI163",info:"19:15 起飛"}
        ], 
        exps:[{d:"機票",a:25116},{d:"免稅",a:7440},{d:"住宿",a:8086},{d:"吃喝玩樂",a:47546}]
    },
    {
        name:"2023 越南峴港", 
        legs:[
            {f:"KHH",t:"DAD",d:"2023-12-30",n:"QH9527",info:"越竹航空"},
            {f:"DAD",t:"KHH",d:"2024-01-04",n:"QH9526",info:"越竹航空"}
        ], 
        exps:[{d:"團費",a:32100},{d:"網卡",a:770},{d:"小費",a:3600},{d:"阿雄百貨",a:5300},{d:"機場",a:31198}]
    }
];

let trips = JSON.parse(localStorage.getItem('flog_v8'));
// 每次進入都會檢查，如果沒資料就自動注入修復版
if(!trips || trips.length < 3) { trips = recoveredData; saveAndRender(); }

function renderAll() {
    trips.sort((a, b) => new Date(b.legs[0].d) - new Date(a.legs[0].d));
    const list = document.getElementById('trips-list');
    list.innerHTML = trips.map((t, idx) => `
        <div class="card" onclick="openModal(${idx})">
            <div style="display:flex;justify-content:space-between"><span class="tag">RESTORED</span><span onclick="event.stopPropagation();delTrip(${idx})" style="color:var(--muted);font-size:12px">刪除</span></div>
            <h3 style="margin:10px 0">📍 ${t.name}</h3>
            ${t.legs.map(l=>`<div style="font-size:12px;color:var(--muted)">✈ ${l.f} → ${l.t} <span style="float:right">${l.n}</span></div>`).join('')}
            <div style="margin-top:10px;color:var(--accent);font-weight:600;border-top:1px solid var(--border);padding-top:10px">💰 TWD ${t.exps.reduce((s,e)=>s+Number(e.a),0).toLocaleString()}</div>
        </div>
    `).join('');
    renderMap();
}

function openModal(idx) {
    const t = trips[idx];
    document.getElementById('modal-content').innerHTML = `
        <h2 style="margin-bottom:20px">📍 ${t.name}</h2>
        <p style="font-size:12px;color:var(--muted);margin-bottom:10px">航班明細</p>
        ${t.legs.map(l=>`
            <div class="flight-item">
                <div style="display:flex;justify-content:space-between"><strong>${l.f} ➔ ${l.t}</strong> <span style="color:var(--accent)">${l.n}</span></div>
                <div style="font-size:12px;color:var(--muted);margin-top:4px">${l.d} | ${l.info || '航班資訊查詢中'}</div>
            </div>
        `).join('')}
        
        <p style="font-size:12px;color:var(--muted);margin-top:20px;margin-bottom:10px">收支管理</p>
        <div style="background:rgba(255,255,255,0.03);padding:0 15px;border-radius:15px">
            ${t.exps.map((e, ei) => `
                <div class="exp-item">
                    <span>${e.d}</span>
                    <div>
                        <strong style="margin-right:12px">$${Number(e.a).toLocaleString()}</strong>
                        <span onclick="delExp(${idx},${ei})" style="color:var(--muted)">✕</span>
                    </div>
                </div>
            `).join('')}
            <div style="padding:15px 0">
                <input type="text" id="new-exp-d" placeholder="項目內容 (如: 伴手禮)">
                <input type="number" id="new-exp-a" placeholder="金額 (TWD)">
                <button class="btn-orange" style="background:var(--accent2)" onclick="addExp(${idx})">新增收支</button>
            </div>
        </div>
    `;
    document.getElementById('modal').style.display = 'flex';
}

function addExp(idx) {
    const d = document.getElementById('new-exp-d').value;
    const a = document.getElementById('new-exp-a').value;
    if(!d || !a) return;
    trips[idx].exps.push({d, a});
    saveAndRender(); openModal(idx);
}

function delExp(tIdx, eIdx) {
    if(confirm('刪除這筆開支？')) { trips[tIdx].exps.splice(eIdx, 1); saveAndRender(); openModal(tIdx); }
}

function renderMap() {
    const cvs = document.getElementById('map-canvas'); const ctx = cvs.getContext('2d');
    const w = cvs.width = cvs.offsetWidth; const h = cvs.height = cvs.offsetHeight;
    ctx.clearRect(0,0,w,h);
    let all = [];
    trips.forEach(t=>t.legs.forEach(l=>{if(AIRPORTS[l.f])all.push(AIRPORTS[l.f]);if(AIRPORTS[l.t])all.push(AIRPORTS[l.t])}));
    if(!all.length) return;
    const minLat=Math.min(...all.map(p=>p.lat))-5, maxLat=Math.max(...all.map(p=>p.lat))+5;
    const minLng=Math.min(...all.map(p=>p.lng))-5, maxLng=Math.max(...all.map(p=>p.lng))+5;
    const getX=lng=>(lng-minLng)/(maxLng-minLng)*w, getY=lat=>h-(lat-minLat)/(maxLat-minLat)*h;

    trips.forEach((t,ti)=>{
        ctx.strokeStyle=ti===0?'#f97316':'#3b82f6'; ctx.setLineDash([5, 5]);
        t.legs.forEach(l=>{
            const f=AIRPORTS[l.f], tt=AIRPORTS[l.t]; if(!f||!tt) return;
            const x1=getX(f.lng), y1=getY(f.lat), x2=getX(tt.lng), y2=getY(tt.lat);
            ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2, Math.min(y1,y2)-30, x2,y2); ctx.stroke();
        });
    });
}

function showPg(p) { document.querySelectorAll('.page').forEach(e=>e.style.display='none'); document.getElementById('pg-'+p).style.display='block'; document.querySelectorAll('.ntab').forEach(n=>n.classList.remove('active')); document.getElementById('btn-'+p).classList.add('active'); if(p==='map') renderAll(); }
function addLeg() { const d = document.createElement('div'); d.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px"><input type="text" class="l-f" placeholder="從"><input type="text" class="l-t" placeholder="到"><input type="date" class="l-d"></div>'; document.getElementById('leg-container').appendChild(d); }
function saveAndRender() { localStorage.setItem('flog_v8', JSON.stringify(trips)); renderAll(); }
function closeModal() { document.getElementById('modal').style.display='none'; }
function delTrip(idx) { if(confirm('確定刪除？')){trips.splice(idx,1); saveAndRender();} }
function backupData() { alert("數據已自動保存在瀏覽器。"); }

window.onload = () => { addLeg(); renderAll(); };
</script>
</body>
</html>
