<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FlightLog Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;--surface:#161b22;--border:rgba(255,255,255,0.1);
  --text:#dce4f0;--muted:rgba(255,255,255,0.4);--accent:#f97316;
  --accent2:#3b82f6;--safe:#10b981;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:calc(44px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--accent);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.brand-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.card{background:var(--surface);border-radius:18px;padding:20px;margin:12px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;font-weight:700;letter-spacing:1px}
input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-size:16px;width:100%;font-family:'Outfit',sans-serif}
input:focus{border-color:var(--accent);outline:none}
#flight-info-display{margin-top:10px;padding:12px;background:rgba(59,130,246,0.1);border-radius:10px;display:none;border-left:4px solid var(--accent2)}
.info-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.airline-tag{color:var(--accent2);font-weight:700}
.apt-dropdown{position:absolute;top:100%;left:0;right:0;background:#1c2128;border:1px solid var(--accent);border-radius:12px;z-index:1000;max-height:200px;overflow-y:auto;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.8)}
.apt-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.apt-code{font-family:'Space Mono',monospace;color:var(--accent);font-weight:700;background:rgba(249,115,22,0.1);padding:2px 6px;border-radius:4px}
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:12px 0;border:none;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ntab.active{color:var(--accent)}
.ni{font-size:22px}
.btn{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;font-size:16px;width:100%;font-weight:700;margin-top:10px}
.page{display:none}
.page.active{display:block}
.delete-btn{background:none;border:none;color:var(--muted);font-size:12px;margin-top:15px;text-decoration:underline}
</style>
</head>
<body>

<div id="hdr">
  <div class="brand"><span class="brand-dot"></span> FLIGHT LOG PRO</div>
</div>

<div id="content">
  <div class="page active" id="pg-list">
    <div id="list-container"></div>
  </div>

  <div class="page" id="pg-add">
    <div class="card">
      <div class="field">
        <label>行程名稱</label>
        <input type="text" id="inp-name" placeholder="例如：澳門週末小旅行">
      </div>
      
      <div class="field">
        <label>班機號碼</label>
        <input type="text" id="inp-fn" placeholder="例如：NX661 或 JX201" oninput="trackFlight(this.value)">
        <div id="flight-info-display">
            <div class="info-row"><span id="info-airline" class="airline-tag">檢索中...</span><span id="info-status" style="color:var(--safe)">● 準點</span></div>
            <div class="info-row"><span style="color:var(--muted)">航空公司狀態</span><span>營運中</span></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field">
          <label>出發地</label>
          <input type="text" id="inp-from" placeholder="KHH" oninput="searchApt(this,'from-drop')">
          <div id="from-drop" class="apt-dropdown"></div>
        </div>
        <div class="field">
          <label>目的地</label>
          <input type="text" id="inp-to" placeholder="目的地" oninput="searchApt(this,'to-drop')">
          <div id="to-drop" class="apt-dropdown"></div>
        </div>
      </div>

      <div class="field">
        <label>乘機日期</label>
        <input type="date" id="inp-date">
      </div>

      <button class="btn" onclick="saveFlight()">儲存至我的行程 ✈</button>
    </div>
  </div>
</div>

<div id="nav">
  <button class="ntab active" onclick="switchTab('list', event)"><span class="ni">📁</span><span>我的行程</span></button>
  <button class="ntab" onclick="switchTab('add', event)"><span class="ni">➕</span><span>新增航班</span></button>
</div>

<script>
// 機場資料庫：涵蓋台灣、澳門、東北亞、東南亞
const AIRPORTS = [
  {code:"KHH",city:"高雄",name:"小港國際機場"},
  {code:"TPE",city:"台北",name:"桃園國際機場"},
  {code:"MFM",city:"澳門",name:"澳門國際機場"},
  {code:"HKG",city:"香港",name:"香港國際機場"},
  {code:"TSA",city:"台北",name:"松山機場"},
  // 日本
  {code:"NRT",city:"東京",name:"成田機場"},
  {code:"HND",city:"東京",name:"羽田機場"},
  {code:"KIX",city:"大阪",name:"關西機場"},
  {code:"FUK",city:"福岡",name:"福岡機場"},
  {code:"OKA",city:"沖繩",name:"那霸機場"},
  // 韓國
  {code:"ICN",city:"首爾",name:"仁川機場"},
  {code:"GMP",city:"首爾",name:"金浦機場"},
  {code:"PUS",city:"釜山",name:"金海機場"},
  // 東南亞
  {code:"BKK",city:"曼谷",name:"蘇凡納布機場"},
  {code:"DMK",city:"曼谷",name:"廊曼機場"},
  {code:"SIN",city:"新加坡",name:"樟宜機場"},
  {code:"SGN",city:"胡志明市",name:"新山一機場"},
  {code:"DAD",city:"峴港",name:"峴港機場"},
  {code:"KUL",city:"吉隆坡",name:"吉隆坡機場"}
];

// 擴充航空公司代碼識別
const AIRLINES = {
  "NX": "澳門航空 Air Macau",
  "JX": "星宇航空 STARLUX",
  "BR": "長榮航空 EVA Air",
  "CI": "中華航空 China Airlines",
  "IT": "台灣虎航 Tigerair Taiwan",
  "CX": "國泰航空 Cathay Pacific",
  "JL": "日本航空 JAL",
  "NH": "全日空 ANA",
  "KE": "大韓航空 Korean Air",
  "OZ": "韓亞航空 Asiana",
  "TG": "泰國航空 Thai Airways",
  "VJ": "越捷航空 VietJet Air"
};

let trips = JSON.parse(localStorage.getItem('my_flights_pro') || '[]');

function switchTab(p, e) {
  document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(tab => tab.classList.remove('active'));
  document.getElementById('pg-' + p).classList.add('active');
  if(e) e.currentTarget.classList.add('active');
  if(p === 'list') renderList();
}

function searchApt(input, dropId) {
  const q = input.value.toUpperCase();
  const drop = document.getElementById(dropId);
  if(!q) { drop.style.display = 'none'; return; }
  
  const res = AIRPORTS.filter(a => a.code.includes(q) || a.city.includes(q) || a.name.includes(q));
  drop.innerHTML = res.map(a => `
    <div class="apt-item" onclick="selApt('${input.id}','${a.code}','${a.city}','${dropId}')">
      <span style="font-size:15px">${a.city} <small style="color:var(--muted)">${a.name}</small></span>
      <span class="apt-code">${a.code}</span>
    </div>
  `).join('');
  drop.style.display = res.length ? 'block' : 'none';
}

function selApt(id, code, city, dropId) {
  document.getElementById(id).value = code + " " + city;
  document.getElementById(dropId).style.display = 'none';
}

function trackFlight(val) {
  const code = val.substring(0, 2).toUpperCase();
  const infoBox = document.getElementById('flight-info-display');
  if(AIRLINES[code]) {
    infoBox.style.display = 'block';
    document.getElementById('info-airline').textContent = AIRLINES[code];
  } else {
    infoBox.style.display = 'none';
  }
}

function saveFlight() {
  const name = document.getElementById('inp-name').value;
  const from = document.getElementById('inp-from').value;
  const to = document.getElementById('inp-to').value;
  const fn = document.getElementById('inp-fn').value;
  const date = document.getElementById('inp-date').value;

  if(!name || !from || !to) return alert('請填寫完整行程資訊');

  trips.unshift({ name, from, to, fn, date });
  localStorage.setItem('my_flights_pro', JSON.stringify(trips));
  
  alert('航班已儲存至 App');
  switchTab('list');
  // 清空輸入
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-from').value = '';
  document.getElementById('inp-to').value = '';
  document.getElementById('inp-fn').value = '';
}

function renderList() {
  const container = document.getElementById('list-container');
  if(trips.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:80px;color:var(--muted);font-size:14px">📭 目前沒有記錄<br>點擊下方 ＋ 開始新增</div>`;
    return;
  }
  container.innerHTML = trips.map((t, i) => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px">
        <span style="color:var(--accent);font-weight:700;font-family:'Space Mono'">${t.fn || 'FLIGHT'}</span>
        <span style="font-size:12px;color:var(--muted)">📅 ${t.date}</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0">
        <div style="text-align:left">
            <div style="font-size:28px;font-weight:700">${t.from.split(' ')[0]}</div>
            <div style="font-size:12px;color:var(--muted)">出發地</div>
        </div>
        <div style="font-size:20px;color:var(--accent);opacity:0.5">✈</div>
        <div style="text-align:right">
            <div style="font-size:28px;font-weight:700">${t.to.split(' ')[0]}</div>
            <div style="font-size:12px;color:var(--muted)">目的地</div>
        </div>
      </div>
      <div style="margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.05);font-size:14px;color:var(--text)">
        🏷️ ${t.name}
      </div>
      <button onclick="delTrip(${i})" class="delete-btn">移除此記錄</button>
    </div>
  `).join('');
}

function delTrip(i) {
  if(confirm('確定要移除這筆航班記錄嗎？')) {
    trips.splice(i, 1);
    localStorage.setItem('my_flights_pro', JSON.stringify(trips));
    renderList();
  }
}

renderList();
</script>
</body>
</html>
