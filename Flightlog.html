<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FlightLog Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --text:#dce4f0;--muted:rgba(255,255,255,0.4);--accent:#f97316;
  --accent2:#3b82f6;--safe:#10b981;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:calc(48px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--accent);letter-spacing:4px;display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}

/* MAP */
#map-wrap{position:relative;margin:12px;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:#0b1120}
#world-map{width:100%;display:block}
#arc-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* CARDS */
.card{background:var(--surface);border-radius:18px;padding:20px;margin:12px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;font-weight:700;letter-spacing:1px}
input,select{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-size:16px;width:100%;font-family:'Outfit',sans-serif}

/* TAB & FINDER */
.itab-row{display:flex;gap:8px;margin-bottom:16px}
.itab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--muted);font-size:13px;font-weight:600}
.itab.active{background:rgba(249,115,22,0.1);border-color:var(--accent);color:var(--accent)}
.finder-box{background:rgba(59,130,246,0.1);border:1px solid var(--accent2);border-radius:12px;padding:12px;margin-top:8px;display:none}
.finder-item{padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px}

/* SWITCH */
.rt-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.03);padding:12px;border-radius:12px;margin-bottom:16px;border:1px solid var(--border)}

/* NAV */
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:12px 0;border:none;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ntab.active{color:var(--accent)}
.ni{font-size:22px}
.btn{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;font-size:16px;width:100%;font-weight:700;margin-top:10px}
.page{display:none}
.page.active{display:block}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:0.3s;z-index:2000;pointer-events:none}
.apt-dropdown{position:absolute;top:100%;left:0;right:0;background:#131825;border:1px solid var(--accent);border-radius:12px;z-index:1000;max-height:180px;overflow-y:auto;display:none}
.apt-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
</style>
</head>
<body>

<div id="hdr"><div class="brand"><span class="brand-dot"></span>✈ FLIGHT LOG PRO</div></div>

<div id="content">
  <div class="page active" id="pg-map">
    <div id="map-wrap">
      <canvas id="world-map" height="220"></canvas>
      <canvas id="arc-layer"></canvas>
    </div>
    <div id="trips-list"></div>
  </div>

  <div class="page" id="pg-add">
    <div class="card">
      <div class="itab-row">
        <button class="itab active" id="t-f" onclick="switchInner('f')">✈ 航班</button>
        <button class="itab" id="t-e" onclick="switchInner('e')">💰 開支</button>
      </div>

      <div id="form-f">
        <div class="field"><label>行程名稱</label><input type="text" id="i-name" placeholder="例：首爾購物行"></div>
        <div class="rt-row"><label>開啟來回模式</label><input type="checkbox" id="i-rt" style="width:20px;height:20px" onchange="toggleRT()"></div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="field"><label>出發地</label><input type="text" id="i-from" placeholder="KHH" oninput="searchApt(this,'d-f')"><div id="d-f" class="apt-dropdown"></div></div>
          <div class="field"><label>目的地</label><input type="text" id="i-to" placeholder="BKK" oninput="searchApt(this,'d-t')"><div id="d-t" class="apt-dropdown"></div></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="field"><label>去程日期</label><input type="date" id="i-date"></div>
          <div class="field"><label>去程班機 (或輸時間搜尋)</label><input type="text" id="i-fn" oninput="findFlight(this.value)"></div>
        </div>
        
        <div id="rt-section" style="display:none; border-top:1px dashed var(--border); padding-top:10px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field"><label>回程日期</label><input type="date" id="i-date-r"></div>
            <div class="field"><label>回程班機</label><input type="text" id="i-fn-r"></div>
          </div>
        </div>

        <div id="finder" class="finder-box"><div id="finder-list"></div></div>
        <button class="btn" onclick="saveTrip()">儲存行程 ✈</button>
      </div>

      <div id="form-e" style="display:none">
        <div class="field"><label>選擇行程</label><select id="e-sel"></select></div>
        <div class="field"><label>金額</label><input type="number" id="e-amt"></div>
        <div class="field"><label>幣別</label><select id="e-cur"><option>TWD</option><option>THB</option><option>JPY</option></select></div>
        <button class="btn" style="background:var(--accent2)" onclick="saveExp()">記錄支出 💰</button>
      </div>
    </div>
  </div>
</div>

<div id="nav">
  <button class="ntab active" onclick="switchTab('map',event)"><span class="ni">🗺️</span><span>地圖</span></button>
  <button class="ntab" onclick="switchTab('add',event)"><span class="ni">＋</span><span>新增</span></button>
</div>
<div id="toast"></div>

<script>
const AIRPORTS = [
  {code:"KHH",city:"高雄",lat:22.577,lng:120.349},
  {code:"TPE",city:"台北",lat:25.077,lng:121.232},
  {code:"MFM",city:"澳門",lat:22.149,lng:113.591},
  {code:"BKK",city:"曼谷(BKK)",lat:13.690,lng:100.750},
  {code:"DMK",city:"曼谷(DMK)",lat:13.912,lng:100.606},
  {code:"ICN",city:"首爾",lat:37.469,lng:126.450},
  {code:"NRT",city:"東京",lat:35.772,lng:140.392},
  {code:"HKG",city:"香港",lat:22.308,lng:113.918},
  {code:"SIN",city:"新加坡",lat:1.364,lng:103.991}
];

let trips = JSON.parse(localStorage.getItem('fl_pro_final') || '[]');

function toggleRT() { document.getElementById('rt-section').style.display = document.getElementById('i-rt').checked ? 'block' : 'none'; }

function switchTab(t, e) {
  document.querySelectorAll('.page, .ntab').forEach(el => el.classList.remove('active'));
  document.getElementById('pg-'+t).classList.add('active');
  if(e) e.currentTarget.classList.add('active');
  if(t === 'map') { renderMap(); renderList(); }
  if(t === 'add') updateExpSel();
}

function switchInner(m) {
  document.getElementById('form-f').style.display = m === 'f' ? 'block' : 'none';
  document.getElementById('form-e').style.display = m === 'e' ? 'block' : 'none';
  document.getElementById('t-f').className = 'itab' + (m === 'f' ? ' active' : '');
  document.getElementById('t-e').className = 'itab' + (m === 'e' ? ' active' : '');
}

function searchApt(input, dropId) {
  const q = input.value.toUpperCase();
  const drop = document.getElementById(dropId);
  if(!q) { drop.style.display = 'none'; return; }
  const res = AIRPORTS.filter(a => a.code.includes(q) || a.city.includes(q));
  drop.innerHTML = res.map(a => `<div class="apt-item" onclick="selApt('${input.id}','${a.code}','${a.city}','${dropId}')"><span>${a.city}</span><strong>${a.code}</strong></div>`).join('');
  drop.style.display = res.length ? 'block' : 'none';
}

function selApt(id, code, city, dropId) {
  document.getElementById(id).value = code + " " + city;
  document.getElementById(dropId).style.display = 'none';
}

function findFlight(val) {
  const f = document.getElementById('finder');
  if(val.length >= 2 && !isNaN(val)) {
    f.style.display = 'block';
    const h = val.substring(0,2);
    document.getElementById('finder-list').innerHTML = `
      <div class="finder-item" onclick="applyF('BR${100+parseInt(h)}')"><span>BR${100+parseInt(h)} (長榮)</span><span>${h}:15</span></div>
      <div class="finder-item" onclick="applyF('CI${200+parseInt(h)}')"><span>CI${200+parseInt(h)} (華航)</span><span>${h}:40</span></div>
    `;
  } else { f.style.display = 'none'; }
}
function applyF(n) { document.getElementById('i-fn').value = n; document.getElementById('finder').style.display = 'none'; }

function saveTrip() {
  const name = document.getElementById('i-name').value.trim();
  const fVal = document.getElementById('i-from').value;
  const tVal = document.getElementById('i-to').value;
  const date = document.getElementById('i-date').value;
  const isRT = document.getElementById('i-rt').checked;

  if(!name || !fVal || !tVal || !date) return showToast('⚠️ 填寫不完整');

  const fC = fVal.split(' ')[0], tC = tVal.split(' ')[0];
  let newTrip = { name, legs: [], exps: [] };
  
  // 去程
  newTrip.legs.push({ fC, tC, date, fn: document.getElementById('i-fn').value });

  // 回程 (關鍵修正：將回程座標反轉後存入)
  if(isRT) {
    const dR = document.getElementById('i-date-r').value;
    if(dR) newTrip.legs.push({ fC: tC, tC: fC, date: dR, fn: document.getElementById('i-fn-r').value });
  }

  trips.unshift(newTrip);
  localStorage.setItem('fl_pro_final', JSON.stringify(trips));
  showToast('✈ 行程已建立');
  switchTab('map');
}

function updateExpSel() {
  document.getElementById('e-sel').innerHTML = trips.map((t, i) => `<option value="${i}">${t.name}</option>`).join('');
}

function saveExp() {
  const i = document.getElementById('e-sel').value;
  const a = document.getElementById('e-amt').value;
  if(!a) return;
  trips[i].exps.push({ amt: a, cur: document.getElementById('e-cur').value });
  localStorage.setItem('fl_pro_final', JSON.stringify(trips));
  showToast('💰 開支已記錄');
}

function renderMap() {
  const cvs = document.getElementById('world-map'), acvs = document.getElementById('arc-layer');
  const ctx = cvs.getContext('2d'), actx = acvs.getContext('2d');
  const w = cvs.width = acvs.width = document.getElementById('map-wrap').clientWidth, h = 220;
  cvs.height = acvs.height = h;

  ctx.fillStyle = '#0b1120'; ctx.fillRect(0,0,w,h);
  trips.forEach((t, i) => {
    const col = ['#f97316','#3b82f6','#10b981'][i%3];
    t.legs.forEach(l => {
      const f = AIRPORTS.find(a => a.code === l.fC), tt = AIRPORTS.find(a => a.code === l.tC);
      if(!f || !tt) return;
      const x1 = (f.lng+180)*(w/360), y1 = (90-f.lat)*(h/180);
      const x2 = (tt.lng+180)*(w/360), y2 = (90-tt.lat)*(h/180);
      actx.beginPath(); actx.strokeStyle = col; actx.lineWidth = 2;
      actx.moveTo(x1,y1); actx.quadraticCurveTo((x1+x2)/2, Math.min(y1,y2)-40, x2,y2); actx.stroke();
      actx.fillStyle = col; actx.beginPath(); actx.arc(x1,y1,4,0,Math.PI*2); actx.fill();
      actx.beginPath(); actx.arc(x2,y2,4,0,Math.PI*2); actx.fill();
    });
  });
}

function renderList() {
  document.getElementById('trips-list').innerHTML = trips.map((t, i) => `
    <div class="card" style="margin-top:0; margin-bottom:12px">
      <div style="display:flex;justify-content:space-between"><strong>${t.name}</strong><span onclick="del(${i})" style="font-size:12px;color:var(--muted)">刪除</span></div>
      ${t.legs.map(l => `<div style="font-size:13px;margin-top:8px;background:rgba(0,0,0,0.2);padding:8px;border-radius:8px">✈ ${l.fC} → ${l.tC} <span style="float:right">${l.date}</span></div>`).join('')}
    </div>`).join('');
}

function del(i) { if(confirm('刪除？')) { trips.splice(i,1); localStorage.setItem('fl_pro_final', JSON.stringify(trips)); renderMap(); renderList(); } }
function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2000); }
window.onload = () => { setTimeout(renderMap, 300); renderList(); };
</script>
</body>
</html>
