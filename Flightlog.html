<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FlightLog Pro v9.8 - Final</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090e;--surface:#161b22;--border:rgba(255,255,255,0.1);--text:#dce4f0;--muted:#8b949e;--accent:#f97316;--accent2:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#hdr{padding:calc(44px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#content{flex:1;overflow-y:auto;padding-bottom:100px}
#map-wrap{position:relative;margin:16px;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:#0d1117;height:180px}
#map-canvas{width:100%;height:100%}
.card{background:var(--surface);border-radius:18px;padding:16px;margin:12px;border:1px solid var(--border);position:relative}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent);color:white;font-weight:700}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;padding:calc(40px + env(safe-area-inset-top)) 20px}
.modal-content{flex:1;overflow-y:auto}
input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:white;padding:14px;width:100%;margin-bottom:10px;outline:none}
.btn-orange{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;width:100%;font-weight:700;margin-top:10px}
.exp-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:16px 0;background:none;border:none;color:var(--muted);text-align:center;font-size:11px}
.ntab.active{color:var(--accent)}
</style>
</head>
<body>

<div id="hdr">
    <div style="color:var(--accent);font-weight:700;letter-spacing:2px">● FLIGHT LOG PRO</div>
    <div style="font-size:10px;color:var(--muted);border:1px solid var(--border);padding:4px 8px;border-radius:20px" onclick="backupData()">備份數據</div>
</div>

<div id="content">
  <div id="pg-map" class="page">
    <div id="map-wrap"><canvas id="map-canvas"></canvas></div>
    <div id="trips-list"></div>
  </div>
  <div id="pg-add" class="page" style="display:none;padding:20px">
    <input type="text" id="i-name" placeholder="行程名稱（例如：2026 首爾）">
    <div id="leg-container"></div>
    <button onclick="addLeg()" style="width:100%;padding:12px;margin:10px 0;background:none;border:1px dashed var(--muted);color:var(--muted);border-radius:12px">＋ 新增航段</button>
    <button class="btn-orange" onclick="saveTrip()">儲存行程 ✈</button>
  </div>
</div>

<div id="modal" class="modal">
  <span style="align-self:flex-end;font-size:28px;padding:10px;color:var(--muted)" onclick="closeModal()">✕</span>
  <div class="modal-content" id="modal-content"></div>
</div>

<div id="nav">
  <button class="ntab active" id="btn-map" onclick="showPg('map')">🗺️ 地圖</button>
  <button class="ntab" id="btn-add" onclick="showPg('add')">＋ 新增</button>
</div>

<script>
// 機場座標
const AIRPORTS = {"KHH":{lat:22.57,lng:120.34},"TPE":{lat:25.07,lng:121.23},"ICN":{lat:37.46,lng:126.45},"KIX":{lat:34.43,lng:135.24},"DPS":{lat:-8.74,lng:115.16},"MFM":{lat:22.15,lng:113.59},"DAD":{lat:16.05,lng:108.20}};

// 救援資料
const recoveredData = [
    {name:"2025 峇里島", legs:[{f:"TPE",t:"DPS",d:"2025-04-06",n:"BR255"},{f:"DPS",t:"TPE",d:"2025-04-10",n:"BR256"}], exps:[{d:"合計紀錄",a:89284}]},
    {name:"2023 釜山", legs:[{f:"KHH",t:"ICN",d:"2023-01-01",n:"BR146"},{f:"ICN",t:"TPE",d:"2023-01-05",n:"CI163"}], exps:[{d:"合計紀錄",a:88188}]},
    {name:"2023 越南峴港", legs:[{f:"KHH",t:"DAD",d:"2023-06-01",n:"QH9527"},{f:"DAD",t:"KHH",d:"2023-06-05",n:"QH9526"}], exps:[{d:"合計紀錄",a:72968}]},
    {name:"2024 跨年", legs:[{f:"KHH",t:"KIX",d:"2024-12-25",n:"BR182"},{f:"KIX",t:"ICN",d:"2024-12-30",n:"KE728"},{f:"ICN",t:"KHH",d:"2025-01-03",n:"BR171"}], exps:[{d:"合計紀錄",a:70467}]},
    {name:"2025 澳門", legs:[{f:"KHH",t:"MFM",d:"2025-05-01",n:"BR2913"}], exps:[]}
];

let trips = JSON.parse(localStorage.getItem('flog_v8'));
if(!trips || trips.length === 0) { trips = recoveredData; localStorage.setItem('flog_v8', JSON.stringify(trips)); }

function sortTrips() {
    trips.sort((a, b) => {
        const dA = a.legs[0] ? new Date(a.legs[0].d) : new Date(0);
        const dB = b.legs[0] ? new Date(b.legs[0].d) : new Date(0);
        return dB - dA;
    });
}

function renderAll() {
    sortTrips();
    const list = document.getElementById('trips-list');
    list.innerHTML = trips.map((t, idx) => `
        <div class="card" onclick="openModal(${idx})">
            <div style="display:flex;justify-content:space-between"><span class="tag">Trip</span><span onclick="event.stopPropagation();delTrip(${idx})" style="color:var(--muted);font-size:12px">刪除</span></div>
            <h3 style="margin:10px 0">📍 ${t.name}</h3>
            ${t.legs.map(l=>`<div style="font-size:13px;color:var(--muted)">✈ ${l.f} → ${l.t} <span style="float:right">${l.n}</span></div>`).join('')}
            <div style="margin-top:10px;color:var(--accent);font-weight:600;border-top:1px solid var(--border);padding-top:10px">💰 TWD ${t.exps.reduce((s,e)=>s+Number(e.a),0).toLocaleString()}</div>
        </div>
    `).join('');
    renderMap();
}

function openModal(idx) {
    const t = trips[idx];
    document.getElementById('modal-content').innerHTML = `
        <h2 style="margin-bottom:20px">📍 ${t.name}</h2>
        <div style="background:rgba(255,255,255,0.03);padding:15px;border-radius:15px;margin-bottom:20px">
            <p style="font-size:12px;color:var(--muted);margin-bottom:10px">航班資訊</p>
            ${t.legs.map(l=>`<div style="margin-bottom:8px">${l.d} | <strong>${l.f} → ${l.t}</strong> (${l.n})</div>`).join('')}
        </div>
        <div style="background:rgba(255,255,255,0.03);padding:15px;border-radius:15px">
            <p style="font-size:12px;color:var(--muted);margin-bottom:10px">開支明細</p>
            ${t.exps.length ? t.exps.map((e, ei) => `
                <div class="exp-item">
                    <span>${e.d}</span>
                    <div>
                        <strong style="color:var(--accent);margin-right:12px">$${Number(e.a).toLocaleString()}</strong>
                        <span onclick="delExp(${idx},${ei})" style="color:var(--muted)">✕</span>
                    </div>
                </div>
            `).join('') : '<p style="color:var(--muted);font-size:13px">尚無開支記錄</p>'}
            <div style="margin-top:15px">
                <input type="text" id="new-exp-d" placeholder="項目內容">
                <input type="number" id="new-exp-a" placeholder="金額 (TWD)">
                <button class="btn-orange" style="background:var(--accent2);width:100%" onclick="addExp(${idx})">新增支出</button>
            </div>
        </div>
    `;
    document.getElementById('modal').style.display = 'flex';
}

function addExp(idx) {
    const d = document.getElementById('new-exp-d').value;
    const a = document.getElementById('new-exp-a').value;
    if(!d || !a) return;
    trips[idx].exps.push({d, a});
    saveAndRender(); openModal(idx);
}

function delExp(tIdx, eIdx) {
    if(confirm('刪除這筆開支？')) { trips[tIdx].exps.splice(eIdx, 1); saveAndRender(); openModal(tIdx); }
}

function saveTrip() {
    const name = document.getElementById('i-name').value;
    if(!name) return alert('請輸入行程名稱');
    let legs = [];
    document.querySelectorAll('.leg-entry').forEach(e => {
        const f = e.querySelector('.l-f').value.toUpperCase();
        const t = e.querySelector('.l-t').value.toUpperCase();
        const d = e.querySelector('.l-d').value;
        if(f && t) legs.push({f, t, d, n:""});
    });
    trips.push({name, legs, exps:[]});
    saveAndRender();
    document.getElementById('leg-container').innerHTML = '';
    document.getElementById('i-name').value = '';
    addLeg(); showPg('map');
}

function renderMap() {
    const cvs = document.getElementById('map-canvas'); const ctx = cvs.getContext('2d');
    const w = cvs.width = cvs.offsetWidth; const h = cvs.height = cvs.offsetHeight;
    ctx.clearRect(0,0,w,h);
    let all = [];
    trips.forEach(t=>t.legs.forEach(l=>{if(AIRPORTS[l.f])all.push(AIRPORTS[l.f]);if(AIRPORTS[l.t])all.push(AIRPORTS[l.t])}));
    if(!all.length) return;
    const minLat=Math.min(...all.map(p=>p.lat))-5, maxLat=Math.max(...all.map(p=>p.lat))+5;
    const minLng=Math.min(...all.map(p=>p.lng))-5, maxLng=Math.max(...all.map(p=>p.lng))+5;
    const getX=lng=>(lng-minLng)/(maxLng-minLng)*w, getY=lat=>h-(lat-minLat)/(maxLat-minLat)*h;

    trips.forEach((t,ti)=>{
        const col = ti===0?'#f97316':'#3b82f6';
        t.legs.forEach(l=>{
            const f=AIRPORTS[l.f], tt=AIRPORTS[l.t]; if(!f||!tt) return;
            const x1=getX(f.lng), y1=getY(f.lat), x2=getX(tt.lng), y2=getY(tt.lat);
            ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x1,y1);
            ctx.quadraticCurveTo((x1+x2)/2, Math.min(y1,y2)-30, x2,y2); ctx.stroke();
            ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x1,y1,3,0,7); ctx.arc(x2,y2,3,0,7); ctx.fill();
        });
    });
}

function showPg(p) { document.querySelectorAll('.page').forEach(e=>e.style.display='none'); document.getElementById('pg-'+p).style.display='block'; document.querySelectorAll('.ntab').forEach(n=>n.classList.remove('active')); document.getElementById('btn-'+p).classList.add('active'); if(p==='map') renderAll(); }
function addLeg() { const d = document.createElement('div'); d.className='leg-entry'; d.style.display="grid"; d.style.gridTemplateColumns="1fr 1fr 1fr"; d.style.gap="5px"; d.innerHTML='<input type="text" class="l-f" placeholder="從"><input type="text" class="l-t" placeholder="到"><input type="date" class="l-d">'; document.getElementById('leg-container').appendChild(d); }
function saveAndRender() { localStorage.setItem('flog_v8', JSON.stringify(trips)); renderAll(); }
function closeModal() { document.getElementById('modal').style.display='none'; }
function delTrip(idx) { if(confirm('確定刪除整個行程？')){trips.splice(idx,1); saveAndRender();} }
function backupData() { const data = JSON.stringify(trips); const el = document.createElement('textarea'); el.value = data; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); alert("數據已複製到剪貼簿！"); }

window.onload = () => { addLeg(); renderAll(); };
</script>
</body>
</html>
