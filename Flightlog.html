<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FlightLog Pro v9.0 - Smart Sort</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090e;--surface:#161b22;--border:rgba(255,255,255,0.1);--text:#dce4f0;--muted:#8b949e;--accent:#f97316;--accent2:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#hdr{padding:calc(44px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
#content{flex:1;overflow-y:auto;padding-bottom:100px}

/* MAP */
#map-wrap{position:relative;margin:16px;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:#0d1117;height:200px}
#map-canvas{width:100%;height:100%}

/* LIST & CARDS */
.card{background:var(--surface);border-radius:18px;padding:16px;margin:12px;border:1px solid var(--border);position:relative}
.card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent);color:white}

/* MODAL */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:2000;display:none;flex-direction:column;padding:calc(40px + env(safe-area-inset-top)) 20px}
.modal-content{flex:1;overflow-y:auto}
.close-btn{align-self:flex-end;font-size:28px;padding:10px}

/* INPUTS */
input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:white;padding:14px;width:100%;margin-bottom:10px}
.btn-orange{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;width:100%;font-weight:700}
.exp-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}

/* NAV */
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:16px 0;background:none;border:none;color:var(--muted);text-align:center;font-size:11px}
.ntab.active{color:var(--accent)}
</style>
</head>
<body>

<div id="hdr">
    <div style="color:var(--accent);font-weight:700;letter-spacing:2px">FLIGHT LOG PRO</div>
    <div style="font-size:10px;color:var(--muted)" onclick="backupData()">備份數據</div>
</div>

<div id="content">
  <div id="pg-map" class="page">
    <div id="map-wrap"><canvas id="map-canvas"></canvas></div>
    <div id="trips-list"></div>
  </div>
  <div id="pg-add" class="page" style="display:none;padding:20px">
    <input type="text" id="i-name" placeholder="行程名稱">
    <div id="leg-container"></div>
    <button onclick="addLeg()" style="width:100%;padding:10px;margin-bottom:10px;background:none;border:1px dashed var(--muted);color:white">＋ 新增航段</button>
    <button class="btn-orange" onclick="saveTrip()">儲存行程</button>
  </div>
</div>

<div id="modal" class="modal">
  <span class="close-btn" onclick="closeModal()">✕</span>
  <div class="modal-content" id="modal-content"></div>
</div>

<div id="nav">
  <button class="ntab active" onclick="showPg('map')">🗺️ 地圖</button>
  <button class="ntab" onclick="showPg('add')">＋ 新增</button>
</div>

<script>
let trips = JSON.parse(localStorage.getItem('flog_v8') || '[]');

function sortTrips() {
    trips.sort((a, b) => new Date(b.legs[0]?.d || 0) - new Date(a.legs[0]?.d || 0));
}

function showPg(p) {
    document.querySelectorAll('.page').forEach(e=>e.style.display='none');
    document.getElementById('pg-'+p).style.display='block';
    if(p==='map') renderAll();
}

function addLeg() {
    const div = document.createElement('div');
    div.className = 'leg-entry';
    div.innerHTML = `<input type="text" class="l-f" placeholder="從 (如:KHH)"> <input type="text" class="l-t" placeholder="到 (如:KIX)"> <input type="date" class="l-d"> <input type="text" class="l-n" placeholder="航班號">`;
    document.getElementById('leg-container').appendChild(div);
}

function saveTrip() {
    const name = document.getElementById('i-name').value;
    let legs = [];
    document.querySelectorAll('.leg-entry').forEach(e => {
        legs.push({f:e.querySelector('.l-f').value.toUpperCase(), t:e.querySelector('.l-t').value.toUpperCase(), d:e.querySelector('.l-d').value, n:e.querySelector('.l-n').value.toUpperCase()});
    });
    trips.push({name, legs, exps:[]});
    saveAndRender();
    showPg('map');
}

function saveAndRender() {
    sortTrips();
    localStorage.setItem('flog_v8', JSON.stringify(trips));
    renderAll();
}

function renderAll() {
    const list = document.getElementById('trips-list');
    list.innerHTML = trips.map((t, idx) => `
        <div class="card" onclick="openModal(${idx})">
            <div class="card-header"><span class="tag">Trip</span><span onclick="event.stopPropagation();delTrip(${idx})" style="color:var(--muted)">刪除</span></div>
            <h3 style="margin-bottom:8px">📍 ${t.name}</h3>
            ${t.legs.map(l=>`<div style="font-size:12px;color:var(--muted)">${l.d} | ${l.f} → ${l.t} (${l.n})</div>`).join('')}
            <div style="margin-top:10px;color:var(--accent);font-size:12px">💰 開支：TWD ${t.exps.reduce((s,e)=>s+Number(e.a),0)}</div>
        </div>
    `).join('');
    renderMap();
}

function openModal(idx) {
    const t = trips[idx];
    const m = document.getElementById('modal');
    document.getElementById('modal-content').innerHTML = `
        <h2>${t.name}</h2>
        <div style="margin:20px 0">
            ${t.exps.map((e, ei) => `
                <div class="exp-item">
                    <span>${e.d}</span>
                    <div>
                        <strong style="margin-right:10px">$${e.a}</strong>
                        <span onclick="editExp(${idx},${ei})" style="color:var(--accent2)">✎</span>
                        <span onclick="delExp(${idx},${ei})" style="color:var(--muted);margin-left:10px">✕</span>
                    </div>
                </div>
            `).join('')}
        </div>
        <input type="text" id="new-exp-d" placeholder="開支項目">
        <input type="number" id="new-exp-a" placeholder="金額">
        <button class="btn-orange" onclick="addExp(${idx})">新增開支</button>
    `;
    m.style.display = 'flex';
}

function addExp(idx) {
    const d = document.getElementById('new-exp-d').value;
    const a = document.getElementById('new-exp-a').value;
    if(!d || !a) return;
    trips[idx].exps.push({d, a});
    saveAndRender();
    openModal(idx);
}

function editExp(tIdx, eIdx) {
    const newA = prompt("輸入新金額", trips[tIdx].exps[eIdx].a);
    if(newA !== null) {
        trips[tIdx].exps[eIdx].a = newA;
        saveAndRender();
        openModal(tIdx);
    }
}

function delExp(tIdx, eIdx) {
    if(confirm('刪除這筆開支？')) {
        trips[tIdx].exps.splice(eIdx, 1);
        saveAndRender();
        openModal(tIdx);
    }
}

function backupData() {
    alert("請複製此文字備份：" + JSON.stringify(trips));
}

function closeModal() { document.getElementById('modal').style.display='none'; }
function delTrip(idx) { if(confirm('刪除行程？')){trips.splice(idx,1); saveAndRender();} }

// 地圖邏輯略 (沿用 v8.0)
function renderMap() { /* ... 同前版本比例運算 ... */ }

window.onload = () => { addLeg(); sortTrips(); renderAll(); };
</script>
</body>
</html>
