<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FlightLog Pro v8.0 - Final Fix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090e;--surface:#161b22;--border:rgba(255,255,255,0.1);--text:#dce4f0;--muted:#8b949e;--accent:#f97316;--accent2:#3b82f6}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#hdr{padding:calc(44px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Space Mono',monospace;font-size:16px;color:var(--accent);letter-spacing:3px;display:flex;align-items:center;gap:8px}
#content{flex:1;overflow-y:auto;padding-bottom:100px}

/* MAP REPAIR */
#map-wrap{position:relative;margin:16px;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:#0d1117;height:220px}
#map-canvas{width:100%;height:100%}

/* CARDS */
.card{background:var(--surface);border-radius:18px;padding:16px;margin:12px;border:1px solid var(--border);position:relative}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accent);color:white;margin-bottom:8px;display:inline-block}

/* FORM */
.field{margin-bottom:12px;position:relative}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
input,select{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;color:white;padding:14px;font-size:15px;width:100%;outline:none}
.dropdown{position:absolute;top:100%;left:0;right:0;background:#1f2937;border:1px solid var(--accent);border-radius:8px;z-index:100;max-height:150px;overflow-y:auto;display:none}
.drop-item{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px}

/* MODAL */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;display:none;flex-direction:column;padding:calc(40px + env(safe-area-inset-top)) 20px 40px}
.modal-content{flex:1;overflow-y:auto}
.close-btn{align-self:flex-end;font-size:28px;color:var(--muted);margin-bottom:10px}

/* NAV */
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:16px 0;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.ntab.active{color:var(--accent)}
.btn-orange{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;width:100%;font-weight:700;font-size:16px;margin-top:10px}
</style>
</head>
<body>

<div id="hdr"><div class="brand">● FLIGHT LOG PRO</div></div>

<div id="content">
  <div id="pg-map" class="page">
    <div id="map-wrap"><canvas id="map-canvas"></canvas></div>
    <div id="trips-list"></div>
  </div>

  <div id="pg-add" class="page" style="display:none">
    <div class="card">
      <div class="field"><label>行程名稱</label><input type="text" id="i-name" placeholder="例：首爾過年"></div>
      <div id="leg-container"></div>
      <button onclick="addLeg()" style="background:none; border:1px dashed var(--muted); color:var(--text); padding:10px; width:100%; border-radius:10px; margin:10px 0">＋ 新增航段</button>
      <button class="btn-orange" onclick="saveTrip()">儲存行程 ✈</button>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <span class="close-btn" onclick="closeModal()">✕</span>
  <div class="modal-content" id="modal-content"></div>
</div>

<div id="nav">
  <button class="ntab active" id="n-map" onclick="showPg('map')"><span>🗺️</span>地圖</button>
  <button class="ntab" id="n-add" onclick="showPg('add')"><span>＋</span>新增</button>
</div>

<script>
const AIRPORTS = {
  "KHH":{n:"高雄",lat:22.57,lng:120.34},"TPE":{n:"桃園",lat:25.07,lng:121.23},
  "ICN":{n:"仁川",lat:37.46,lng:126.45},"KIX":{n:"關西",lat:34.43,lng:135.24},
  "DPS":{n:"峇里島",lat:-8.74,lng:115.16},"MFM":{n:"澳門",lat:22.15,lng:113.59},
  "BKK":{n:"曼谷",lat:13.69,lng:100.75}
};

const FLIGHTS = {
  "BR2913":"長榮航空 (KHH-MFM)","BR830":"長榮航空 (MFM-KHH)","BR255":"長榮航空 (TPE-DPS)","BR256":"長榮航空 (DPS-TPE)",
  "TG631":"泰國航空 (TPE-BKK)","TG630":"泰國航空 (BKK-TPE)","CI166":"中華航空 (KHH-KIX)","KE728":"大韓航空 (KIX-ICN)","BR182":"長榮航空 (KHH-KIX)"
};

let trips = JSON.parse(localStorage.getItem('flog_v8') || '[]');

function showPg(p) {
  document.querySelectorAll('.page').forEach(e=>e.style.display='none');
  document.getElementById('pg-'+p).style.display='block';
  document.querySelectorAll('.ntab').forEach(e=>e.classList.remove('active'));
  document.getElementById('n-'+p).classList.add('active');
  if(p==='map') renderAll();
}

function addLeg(data=null) {
  const c = document.getElementById('leg-container');
  const d = document.createElement('div');
  d.className = 'leg-entry';
  d.style.padding = "10px 0; border-top:1px solid var(--border)";
  d.innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px">
      <div class="field"><label>出發</label><input type="text" class="l-f" value="${data?data.f:''}" oninput="searchApt(this)"><div class="dropdown"></div></div>
      <div class="field"><label>到達</label><input type="text" class="l-t" value="${data?data.t:''}" oninput="searchApt(this)"><div class="dropdown"></div></div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
      <div class="field"><label>日期</label><input type="date" class="l-d" value="${data?data.d:''}"></div>
      <div class="field"><label>班機號碼</label><input type="text" class="l-n" value="${data?data.n:''}" placeholder="例:BR255"></div>
    </div>
  `;
  c.appendChild(d);
}

function searchApt(inp) {
  const q = inp.value.toUpperCase(); const dd = inp.nextElementSibling;
  if(!q){dd.style.display='none'; return;}
  const res = Object.keys(AIRPORTS).filter(k=>k.includes(q)||AIRPORTS[k].n.includes(q));
  dd.innerHTML = res.map(k=>`<div class="drop-item" onmousedown="this.parentElement.previousElementSibling.value='${k}';this.parentElement.style.display='none'"><span>${AIRPORTS[k].n}</span><strong>${k}</strong></div>`).join('');
  dd.style.display = res.length?'block':'none';
}

function saveTrip() {
  const name = document.getElementById('i-name').value;
  if(!name) return alert('請輸入行程名稱');
  let legs = [];
  document.querySelectorAll('.leg-entry').forEach(e=>{
    legs.push({f:e.querySelector('.l-f').value.toUpperCase(), t:e.querySelector('.l-t').value.toUpperCase(), d:e.querySelector('.l-d').value, n:e.querySelector('.l-n').value.toUpperCase()});
  });
  trips.unshift({name, legs, exps:[]});
  localStorage.setItem('flog_v8', JSON.stringify(trips));
  showPg('map');
  document.getElementById('leg-container').innerHTML = ''; addLeg();
}

function renderAll() {
  renderMap();
  document.getElementById('trips-list').innerHTML = trips.map((t,i)=>`
    <div class="card" onclick="openModal(${i})">
      <div style="display:flex;justify-content:space-between"><span class="tag">Trip</span><span onclick="event.stopPropagation();delTrip(${i})" style="color:var(--muted);font-size:12px">刪除</span></div>
      <h3 style="margin:4px 0 12px">📍 ${t.name}</h3>
      ${t.legs.map(l=>`<div style="font-size:13px;color:var(--muted);margin-bottom:4px">✈ ${l.f} → ${l.t} <span style="float:right">${l.n}</span></div>`).join('')}
      <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;font-size:12px;color:var(--accent)">💰 開支合計: ${t.exps.reduce((s,e)=>s+Number(e.a),0)} (TWD)</div>
    </div>
  `).join('');
}

function renderMap() {
  const cvs = document.getElementById('map-canvas'); const ctx = cvs.getContext('2d');
  const w = cvs.width = cvs.offsetWidth; const h = cvs.height = cvs.offsetHeight;
  ctx.clearRect(0,0,w,h);
  if(!trips.length) return;

  // 找出所有點的經緯度範圍，進行自動縮放
  let allPts = [];
  trips.forEach(t=>t.legs.forEach(l=>{if(AIRPORTS[l.f])allPts.push(AIRPORTS[l.f]); if(AIRPORTS[l.t])allPts.push(AIRPORTS[l.t])}));
  if(!allPts.length) return;
  const minLat = Math.min(...allPts.map(p=>p.lat))-5, maxLat = Math.max(...allPts.map(p=>p.lat))+5;
  const minLng = Math.min(...allPts.map(p=>p.lng))-5, maxLng = Math.max(...allPts.map(p=>p.lng))+5;

  const getX = lng => (lng - minLng) / (maxLng - minLng) * w;
  const getY = lat => h - (lat - minLat) / (maxLat - minLat) * h;

  trips.forEach((t,i)=>{
    const col = i===0?'#f97316':'#3b82f6';
    t.legs.forEach(l=>{
      const f=AIRPORTS[l.f], tt=AIRPORTS[l.t]; if(!f||!tt) return;
      const x1=getX(f.lng), y1=getY(f.lat), x2=getX(tt.lng), y2=getY(tt.lat);
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash([5,3]);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2, Math.min(y1,y2)-30, x2,y2); ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x1,y1,4,0,7); ctx.arc(x2,y2,4,0,7); ctx.fill();
    });
  });
}

function openModal(idx) {
  const t = trips[idx]; const m = document.getElementById('modal');
  document.getElementById('modal-content').innerHTML = `
    <h2 style="margin-bottom:20px">📍 ${t.name}</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:10px">航班明細</p>
    ${t.legs.map(l=>`
      <div class="card" style="margin:0 0 10px 0;background:#1c2128">
        <div style="display:flex;justify-content:space-between"><strong>${l.f} ➔ ${l.t}</strong><span style="color:var(--accent)">${l.n}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${l.d} | ${FLIGHTS[l.n]||'航班資訊查詢中'}</div>
      </div>
    `).join('')}
    <p style="color:var(--muted);font-size:12px;margin:20px 0 10px">收支管理</p>
    <div id="exp-list">${t.exps.map(e=>`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px"><span>${e.d}</span><strong>$${e.a}</strong></div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px">
      <input type="text" id="new-exp-d" placeholder="項目">
      <input type="number" id="new-exp-a" placeholder="金額">
    </div>
    <button class="btn-orange" style="background:var(--accent2)" onclick="addExp(${idx})">新增收支</button>
  `;
  m.style.display = 'flex';
}

function addExp(idx) {
  const d = document.getElementById('new-exp-d').value;
  const a = document.getElementById('new-exp-a').value;
  if(!d||!a) return alert('請輸入項目與金額');
  trips[idx].exps.push({d, a});
  localStorage.setItem('flog_v8', JSON.stringify(trips));
  openModal(idx); renderAll();
}

function closeModal() { document.getElementById('modal').style.display='none'; }
function delTrip(i) { if(confirm('確定刪除？')){trips.splice(i,1);localStorage.setItem('flog_v8',JSON.stringify(trips));renderAll();}}

window.onload = () => { addLeg(); renderAll(); };
</script>
</body>
</html>
