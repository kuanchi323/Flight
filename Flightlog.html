<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FlightLog Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --text:#dce4f0;--muted:rgba(255,255,255,0.4);--accent:#f97316;
  --accent2:#3b82f6;
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:calc(48px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--accent);letter-spacing:4px;display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}

/* MAP */
#map-wrap{position:relative;margin:12px;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:#0b1120}
#world-map{width:100%;display:block;opacity:0.6}
#arc-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* CARDS & FORMS */
.card{background:var(--surface);border-radius:18px;padding:20px;margin:12px;border:1px solid var(--border)}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-weight:700;letter-spacing:1px}
input,select{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px;font-size:14px;width:100%;font-family:'Outfit',sans-serif}

/* 修正日期與班機重疊的 Grid */
.input-row{display:grid;grid-template-columns:1.2fr 0.8fr;gap:10px;margin-bottom:10px}

/* DROPDOWN */
.apt-dropdown, .finder-box{position:absolute;top:100%;left:0;right:0;background:#131825;border:1px solid var(--accent);border-radius:12px;z-index:1000;max-height:150px;overflow-y:auto;display:none}
.apt-item, .finder-item{padding:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px}

/* NAV */
#nav{display:flex;border-top:1px solid var(--border);background:rgba(7,9,14,0.9);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;width:100%}
.ntab{flex:1;padding:12px 0;border:none;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ntab.active{color:var(--accent)}
.btn{background:var(--accent);color:white;border:none;border-radius:12px;padding:16px;font-size:16px;width:100%;font-weight:700;margin-top:10px}
.page{display:none}
.page.active{display:block}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:0.3s;z-index:2000}
</style>
</head>
<body>

<div id="hdr"><div class="brand"><span class="brand-dot"></span>✈ FLIGHT LOG PRO</div></div>

<div id="content">
  <div class="page active" id="pg-map">
    <div id="map-wrap">
      <canvas id="world-map"></canvas>
      <canvas id="arc-layer"></canvas>
    </div>
    <div id="trips-list"></div>
  </div>

  <div class="page" id="pg-add">
    <div class="card">
      <div class="field"><label>行程名稱</label><input type="text" id="i-name" placeholder="例：首爾之旅"></div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
        <span style="font-size:14px; font-weight:600">開啟來回模式</span>
        <input type="checkbox" id="i-rt" style="width:22px;height:22px" onchange="toggleRT()">
      </div>

      <div style="border-left:3px solid var(--accent); padding-left:12px; margin-bottom:25px">
        <label style="font-size:11px; color:var(--accent); font-weight:800">DEPARTURE 去程</label>
        <div class="input-row" style="margin-top:10px">
          <div class="field"><label>出發地</label><input type="text" id="i-f1" placeholder="KHH" oninput="searchApt(this,'d-f1')"><div id="d-f1" class="apt-dropdown"></div></div>
          <div class="field"><label>目的地</label><input type="text" id="i-t1" placeholder="ICN" oninput="searchApt(this,'d-t1')" onblur="autoFillRT()"><div id="d-t1" class="apt-dropdown"></div></div>
        </div>
        <div class="input-row">
          <div class="field"><label>日期</label><input type="date" id="i-d1"></div>
          <div class="field"><label>班機號碼</label><input type="text" id="i-n1" placeholder="搜尋時間" oninput="findF(this.value, 'f-l1', 'i-n1')"><div id="f-l1" class="finder-box"></div></div>
        </div>
      </div>

      <div id="rt-section" style="display:none; border-left:3px solid var(--accent2); padding-left:12px">
        <label style="font-size:11px; color:var(--accent2); font-weight:800">RETURN 回程</label>
        <div class="input-row" style="margin-top:10px">
          <div class="field"><label>出發地</label><input type="text" id="i-f2" placeholder="GMP" oninput="searchApt(this,'d-f2')"><div id="d-f2" class="apt-dropdown"></div></div>
          <div class="field"><label>目的地</label><input type="text" id="i-t2" placeholder="KHH" oninput="searchApt(this,'d-t2')"><div id="d-t2" class="apt-dropdown"></div></div>
        </div>
        <div class="input-row">
          <div class="field"><label>日期</label><input type="date" id="i-d2"></div>
          <div class="field"><label>班機號碼</label><input type="text" id="i-n2" placeholder="搜尋時間" oninput="findF(this.value, 'f-l2', 'i-n2')"><div id="f-l2" class="finder-box"></div></div>
        </div>
      </div>

      <button class="btn" onclick="saveTrip()">儲存行程 ✈</button>
    </div>
  </div>
</div>

<div id="nav">
  <button class="ntab active" onclick="switchTab('map',event)"><span>🗺️</span><span>地圖</span></button>
  <button class="ntab" onclick="switchTab('add',event)"><span>＋</span><span>新增</span></button>
</div>
<div id="toast"></div>

<script>
const AIRPORTS = [
  {code:"KHH",city:"高雄",lat:22.577,lng:120.349},
  {code:"TPE",city:"台北",lat:25.077,lng:121.232},
  {code:"ICN",city:"首爾(ICN)",lat:37.469,lng:126.450},
  {code:"GMP",city:"首爾(GMP)",lat:37.558,lng:126.790},
  {code:"BKK",city:"曼谷",lat:13.690,lng:100.750},
  {code:"MFM",city:"澳門",lat:22.149,lng:113.591}
];

let trips = JSON.parse(localStorage.getItem('fl_pro_v3') || '[]');

function toggleRT() { document.getElementById('rt-section').style.display = document.getElementById('i-rt').checked ? 'block' : 'none'; }

function autoFillRT() {
  const f1 = document.getElementById('i-f1').value, t1 = document.getElementById('i-t1').value;
  if(f1 && !document.getElementById('i-t2').value) document.getElementById('i-t2').value = f1;
  if(t1 && !document.getElementById('i-f2').value) document.getElementById('i-f2').value = t1;
}

function switchTab(t, e) {
  document.querySelectorAll('.page, .ntab').forEach(el => el.classList.remove('active'));
  document.getElementById('pg-'+t).classList.add('active');
  if(e) e.currentTarget.classList.add('active');
  if(t === 'map') { renderMap(); renderList(); }
}

function searchApt(input, dropId) {
  const q = input.value.toUpperCase(), drop = document.getElementById(dropId);
  if(!q) { drop.style.display = 'none'; return; }
  const res = AIRPORTS.filter(a => a.code.includes(q) || a.city.includes(q));
  drop.innerHTML = res.map(a => `<div class="apt-item" onclick="selApt('${input.id}','${a.code}','${a.city}','${dropId}')"><span>${a.city}</span><strong>${a.code}</strong></div>`).join('');
  drop.style.display = res.length ? 'block' : 'none';
}

function selApt(id, code, city, dropId) {
  document.getElementById(id).value = code;
  document.getElementById(dropId).style.display = 'none';
  autoFillRT();
}

function findF(val, listId, inputId) {
  const box = document.getElementById(listId);
  if(val.length >= 2 && !isNaN(val)) {
    box.style.display = 'block';
    box.innerHTML = `<div class="finder-item" onclick="applyF('${inputId}','CI${val}01','${listId}')"><span>建議班機 ${val}:15</span><span>CI${val}01</span></div>
                     <div class="finder-item" onclick="applyF('${inputId}','BR${val}05','${listId}')"><span>建議班機 ${val}:45</span><span>BR${val}05</span></div>`;
  } else { box.style.display = 'none'; }
}
function applyF(id, val, boxId) { document.getElementById(id).value = val; document.getElementById(boxId).style.display = 'none'; }

function saveTrip() {
  const name = document.getElementById('i-name').value;
  if(!name) { showToast('⚠️ 請輸入行程名稱'); return; }
  let newTrip = { name, legs: [] };
  newTrip.legs.push({ fC: document.getElementById('i-f1').value, tC: document.getElementById('i-t1').value, date: document.getElementById('i-d1').value, fn: document.getElementById('i-n1').value });
  if(document.getElementById('i-rt').checked) {
    newTrip.legs.push({ fC: document.getElementById('i-f2').value, tC: document.getElementById('i-t2').value, date: document.getElementById('i-d2').value, fn: document.getElementById('i-n2').value });
  }
  trips.unshift(newTrip);
  localStorage.setItem('fl_pro_v3', JSON.stringify(trips));
  showToast('✈ 行程已儲存');
  switchTab('map');
}

function renderMap() {
  const cvs = document.getElementById('world-map'), acvs = document.getElementById('arc-layer');
  const ctx = cvs.getContext('2d'), actx = acvs.getContext('2d');
  const w = cvs.width = acvs.width = document.getElementById('map-wrap').clientWidth, h = 220;
  cvs.height = acvs.height = h;

  // 1. 繪製強化版背景地圖
  ctx.fillStyle = '#0b1120'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; // 提高大洲對比度
  const continents = [
    [[50,-140],[70,-140],[70,-55],[30,-55]], // 北美
    [[10,40],[75,40],[75,140],[10,100]] // 亞洲簡圖
  ];
  continents.forEach(pts => {
    ctx.beginPath();
    pts.forEach((p,i) => {
      const x = (p[1]+180)*(w/360), y = (90-p[0])*(h/180);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.fill();
  });

  // 2. 繪製航線
  actx.clearRect(0,0,w,h);
  trips.forEach(t => {
    t.legs.forEach(l => {
      const f = AIRPORTS.find(a => a.code === l.fC), tt = AIRPORTS.find(a => a.code === l.tC);
      if(!f || !tt) return;
      const x1 = (f.lng+180)*(w/360), y1 = (90-f.lat)*(h/180), x2 = (tt.lng+180)*(w/360), y2 = (90-tt.lat)*(h/180);
      actx.beginPath(); actx.strokeStyle = '#f97316'; actx.lineWidth = 2;
      actx.moveTo(x1,y1); actx.quadraticCurveTo((x1+x2)/2, Math.min(y1,y2)-30, x2,y2); actx.stroke();
      actx.fillStyle = '#f97316'; [x1,x2].forEach((x,i)=> { actx.beginPath(); actx.arc(x, i===0?y1:y2, 4, 0, 7); actx.fill(); });
    });
  });
}

function renderList() {
  document.getElementById('trips-list').innerHTML = trips.map((t, i) => `
    <div class="card" style="margin-top:0; margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>${t.name}</strong><span onclick="del(${i})" style="font-size:12px;color:var(--muted)">刪除</span></div>
      ${t.legs.map(l => `<div style="font-size:12px;margin-top:5px;background:rgba(0,0,0,0.2);padding:8px;border-radius:10px">✈ ${l.fC} → ${l.tC} <span style="float:right;color:var(--accent)">${l.fn}</span><br><small style="color:var(--muted)">${l.date}</small></div>`).join('')}
    </div>`).join('');
}

function del(i) { trips.splice(i,1); localStorage.setItem('fl_pro_v3', JSON.stringify(trips)); renderMap(); renderList(); }
function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2000); }
window.onload = () => { setTimeout(renderMap, 300); renderList(); };
</script>
</body>
</html>
