<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FlightLog</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07090e;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --text:#dce4f0;--muted:rgba(255,255,255,0.4);--accent:#f97316;
  --accent2:#3b82f6;--danger:rgba(239,68,68,0.7);
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:48px 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--accent);letter-spacing:4px;display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
#stats{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.stat-chip{background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.2);border-radius:20px;padding:3px 10px;color:var(--accent)}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#nav{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.ntab{flex:1;padding:10px 4px;border:none;background:none;color:var(--muted);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.ntab.active{color:var(--accent)}
.ntab.active .ni-wrap{background:rgba(249,115,22,0.15)}
.ni-wrap{width:36px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.ni{font-size:18px}
.page{display:none;padding:0}
.page.active{display:block}
.card{background:var(--surface);border-radius:14px;padding:16px;margin:12px 12px 0;border:1px solid var(--border)}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
input,select{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-size:14px;width:100%;font-family:'Outfit',sans-serif;-webkit-appearance:none}
.btn{background:var(--accent);color:white;border:none;border-radius:10px;padding:14px;font-size:14px;width:100%;margin-top:6px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:700}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-blue{background:var(--accent2)}
.btn-sm{padding:6px 12px;font-size:11px;width:auto;margin-top:0}
#map-wrap{position:relative;margin:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:#0b1120}
#world-map{width:100%;display:block}
#arc-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.map-legend{position:absolute;bottom:8px;left:8px;font-size:10px;color:var(--muted);background:rgba(7,9,14,0.8);padding:6px 10px;border-radius:8px}
.apt-dropdown{position:absolute;top:100%;left:0;right:0;background:#131825;border:1px solid var(--border);border-radius:10px;z-index:200;max-height:180px;overflow-y:auto;display:none;margin-top:4px}
.apt-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.apt-code{font-family:'Space Mono',monospace;color:var(--accent);font-size:12px;font-weight:700}
.trip-card{background:var(--surface);border-radius:14px;padding:16px;margin:12px 12px 0;border:1px solid var(--border)}
.leg-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:6px;padding:8px 10px;background:rgba(0,0,0,0.2);border-radius:8px}
.expense-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 10px;background:rgba(0,0,0,0.2);border-radius:8px;margin-top:4px}
.inner-tabs{display:flex;gap:6px;margin-bottom:16px}
.itab{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-weight:600}
.itab.active{background:rgba(249,115,22,0.15);border-color:rgba(249,115,22,0.4);color:var(--accent)}
.itab-panel{display:none}
.itab-panel.active{display:block}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cat-btn{padding:10px 6px;border:1px solid var(--border);border-radius:10px;background:none;color:var(--muted);font-size:11px;cursor:pointer}
.cat-btn.selected{border-color:var(--accent);background:rgba(249,115,22,0.15);color:var(--accent)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(16,185,129,0.9);color:white;padding:10px 20px;border-radius:30px;font-size:13px;opacity:0;transition:all .3s;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

<div id="hdr">
  <div class="brand"><span class="brand-dot"></span>✈ FLIGHT LOG</div>
  <div id="stats"></div>
</div>

<div id="content">
  <div class="page active" id="pg-map">
    <div id="map-wrap">
      <canvas id="world-map" height="220"></canvas>
      <canvas id="arc-layer"></canvas>
      <div class="map-legend" id="map-legend"></div>
    </div>
    <div id="trips-map-list"></div>
  </div>

  <div class="page" id="pg-trips">
    <div id="trips-list"></div>
  </div>

  <div class="page" id="pg-add">
    <div class="card">
      <div class="inner-tabs">
        <button class="itab active" onclick="switchInner('flight', event)">✈ 新增航班</button>
        <button class="itab" onclick="switchInner('expense', event)">💰 新增開支</button>
      </div>
      <div class="itab-panel active" id="panel-flight">
        <div class="field"><label>行程名稱</label><input type="text" id="inp-name" placeholder="東京之旅"></div>
        <div class="row2">
          <div class="field">
            <label>出發</label>
            <input type="text" id="inp-from" placeholder="TPE" oninput="searchApt(this,'from-drop')">
            <div id="from-drop" class="apt-dropdown"></div>
          </div>
          <div class="field">
            <label>目的</label>
            <input type="text" id="inp-to" placeholder="NRT" oninput="searchApt(this,'to-drop')">
            <div id="to-drop" class="apt-dropdown"></div>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>日期</label><input type="date" id="inp-date"></div>
          <div class="field"><label>班機號碼</label><input type="text" id="inp-fn" placeholder="BR255"></div>
        </div>
        <button class="btn" id="btn-save">儲存航班 ✈</button>
      </div>
      <div class="itab-panel" id="panel-expense">
        <div class="field"><label>選擇行程</label><select id="exp-trip"></select></div>
        <div class="field">
          <label>類別</label>
          <div class="cat-grid" id="cat-grid">
            <button class="cat-btn selected" data-cat="機票">✈️機票</button>
            <button class="cat-btn" data-cat="住宿">🏨住宿</button>
            <button class="cat-btn" data-cat="餐飲">🍜餐飲</button>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>金額</label><input type="number" id="exp-amount"></div>
          <div class="field"><label>貨幣</label><select id="exp-currency"><option>TWD</option><option>JPY</option><option>KRW</option></select></div>
        </div>
        <button class="btn btn-blue" id="btn-exp">記錄開支 💰</button>
      </div>
    </div>
  </div>
</div>

<div id="nav">
  <button class="ntab active" id="nav-map"><div class="ni-wrap"><span class="ni">🗺️</span></div><span>地圖</span></button>
  <button class="ntab" id="nav-trips"><div class="ni-wrap"><span class="ni">📋</span></div><span>行程</span></button>
  <button class="ntab" id="nav-add"><div class="ni-wrap"><span class="ni">＋</span></div><span>新增</span></button>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var AIRPORTS=[{code:"TPE",name:"桃園",city:"台北",lat:25.07,lng:121.23},{code:"NRT",name:"成田",city:"東京",lat:35.77,lng:140.39},{code:"ICN",name:"仁川",city:"首爾",lat:37.46,lng:126.45},{code:"KIX",name:"關西",city:"大阪",lat:34.43,lng:135.24}];
var trips=[], selCat='機票', aptMeta={};

function save(){localStorage.setItem('fl2',JSON.stringify(trips));}
function load(){var r=localStorage.getItem('fl2');if(r)trips=JSON.parse(r);}

function switchTab(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+t).classList.add('active');
  document.getElementById('nav-'+t).classList.add('active');
  if(t==='map'){renderMap();renderMapList();}
  if(t==='trips')renderTrips();
  if(t==='add')populateExpTrips();
}

function switchInner(t, e){
  document.querySelectorAll('.itab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.itab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  if(e && e.currentTarget) e.currentTarget.classList.add('active');
}

function renderStats(){
  var legs=trips.reduce((s,t)=>s+(t.legs||[]).length,0);
  document.getElementById('stats').innerHTML=`<span class="stat-chip">${trips.length} 行程</span><span class="stat-chip">${legs} 航班</span>`;
}

function renderMap(){
  var mc=document.getElementById('world-map'), ac=document.getElementById('arc-layer');
  var w=mc.parentNode.clientWidth, h=w*0.5;
  mc.width=ac.width=w; mc.height=ac.height=h;
  var actx=ac.getContext('2d'); actx.clearRect(0,0,w,h);
  // 簡化地圖繪製... (略)
}

function renderTrips(){
  var el=document.getElementById('trips-list');
  if(!trips.length){el.innerHTML='<div style="text-align:center;padding:40px">尚無行程</div>';return;}
  el.innerHTML=trips.map((t,i)=>`<div class="trip-card"><b>${t.name}</b><button onclick="delTrip(${i})" style="float:right">刪除</button></div>`).join('');
}

function delTrip(i){ if(confirm('刪除？')){trips.splice(i,1);save();renderTrips();renderStats();} }

function searchApt(input,dropId){
  var q=input.value.toUpperCase(), drop=document.getElementById(dropId);
  var res=AIRPORTS.filter(a=>a.code.includes(q)||a.city.includes(q));
  drop.innerHTML=res.map(a=>`<div class="apt-item" onclick="selApt('${input.id}','${a.code}','${dropId}')">${a.code} - ${a.city}</div>`).join('');
  drop.style.display=res.length?'block':'none';
}
function selApt(id,code,dropId){
  document.getElementById(id).value=code;
  document.getElementById(dropId).style.display='none';
}

document.getElementById('nav-map').onclick=()=>switchTab('map');
document.getElementById('nav-trips').onclick=()=>switchTab('trips');
document.getElementById('nav-add').onclick=()=>switchTab('add');

document.getElementById('btn-save').onclick=()=>{
  var n=document.getElementById('inp-name').value;
  if(!n)return alert('請輸入名稱');
  trips.push({name:n,legs:[],expenses:[]});
  save();renderStats();switchTab('trips');
};

function populateExpTrips(){
  var s=document.getElementById('exp-trip');
  s.innerHTML=trips.map((t,i)=>`<option value="${i}">${t.name}</option>`).join('');
}

load();renderStats();renderMap();
</script>
</body>
</html>
